<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adaptive Learning Flashcards</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
      }
      
      #root {
        min-height: 100vh;
      }
      
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }
      
      .card {
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        padding: 24px;
        margin-bottom: 20px;
      }
      
      .btn {
        background: #667eea;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 500;
        transition: all 0.2s;
      }
      
      .btn:hover {
        background: #5a67d8;
        transform: translateY(-1px);
      }
      
      .btn-secondary {
        background: #e2e8f0;
        color: #4a5568;
      }
      
      .btn-secondary:hover {
        background: #cbd5e0;
      }
      
      .btn-success {
        background: #48bb78;
      }
      
      .btn-success:hover {
        background: #38a169;
      }
      
      .btn-warning {
        background: #ed8936;
      }
      
      .btn-warning:hover {
        background: #dd6b20;
      }
      
      .btn-danger {
        background: #f56565;
      }
      
      .btn-danger:hover {
        background: #e53e3e;
      }
      
      .input {
        width: 100%;
        padding: 12px;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        font-size: 16px;
        margin-bottom: 16px;
      }
      
      .input:focus {
        outline: none;
        border-color: #667eea;
      }
      
      .textarea {
        width: 100%;
        padding: 12px;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        font-size: 16px;
        margin-bottom: 16px;
        min-height: 100px;
        resize: vertical;
      }
      
      .textarea:focus {
        outline: none;
        border-color: #667eea;
      }
      
      .nav {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 24px;
        display: flex;
        gap: 16px;
        align-items: center;
      }
      
      .nav a {
        color: white;
        text-decoration: none;
        padding: 8px 16px;
        border-radius: 6px;
        transition: background 0.2s;
      }
      
      .nav a:hover, .nav a.active {
        background: rgba(255, 255, 255, 0.2);
      }
      
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
      }
      
      .stat-card {
        background: rgba(255, 255, 255, 0.9);
        padding: 20px;
        border-radius: 12px;
        text-align: center;
      }
      
      .stat-number {
        font-size: 2rem;
        font-weight: bold;
        color: #667eea;
      }
      
      .stat-label {
        color: #4a5568;
        margin-top: 4px;
      }
      
      .flashcard {
        background: white;
        border-radius: 16px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        min-height: 300px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px;
        cursor: pointer;
        transition: transform 0.3s ease;
        margin-bottom: 24px;
      }
      
      .flashcard:hover {
        transform: scale(1.02);
      }
      
      .flashcard-content {
        font-size: 1.5rem;
        line-height: 1.6;
      }
      
      .difficulty-buttons {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      
      .loading {
        text-align: center;
        padding: 40px;
        color: white;
        font-size: 1.2rem;
      }
      
      .error {
        background: #fed7d7;
        color: #c53030;
        padding: 16px;
        border-radius: 8px;
        margin-bottom: 16px;
      }
      
      @media (max-width: 768px) {
        .container {
          padding: 16px;
        }
        
        .nav {
          flex-direction: column;
          gap: 8px;
        }
        
        .difficulty-buttons {
          flex-direction: column;
        }
        
        .flashcard {
          padding: 24px;
          min-height: 250px;
        }
        
        .flashcard-content {
          font-size: 1.2rem;
        }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-119eaa08.js"></script>
  </head>
  <body>
    <div id="root"></div>
    
  </body>
</html>
