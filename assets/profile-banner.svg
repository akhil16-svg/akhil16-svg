<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Akhilesh profile banner</title>
  <desc id="desc">Python backend developer and AWS Certified Solutions Architect Associate profile banner.</desc>
  <defs>
