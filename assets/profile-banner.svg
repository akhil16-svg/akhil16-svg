    <text x="794" y="195" fill="#CBD5E1" font-size="17" font-family="SFMono-Regular, Consolas, monospace">build = "secure APIs"</text>
    <text x="794" y="226" fill="#34D399" font-size="17" font-family="SFMono-Regular, Consolas, monospace">deploy("cloud-ready")</text>
